# Full stack (API + web + Caddy HTTPS):
#   cp .env.docker.example .env   # fill secrets + domains + VITE_*
#   docker compose up -d --build
#
# API-only (frontend stays on Vercel):
#   docker compose up -d --build api
#   (point VITE_BACKEND_URL at your VPS API URL and redeploy Vercel)

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: patakeja-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    # Optional direct access for debugging (comment out in hardened deploys)
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CLERK_PUBLISHABLE_KEY_FALLBACK: ${VITE_CLERK_PUBLISHABLE_KEY_FALLBACK:-}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
        VITE_CURRENCY: ${VITE_CURRENCY:-Ksh}
    container_name: patakeja-web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.9-alpine
    container_name: patakeja-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CLIENT_HOST: ${CLIENT_HOST:-localhost}
      API_HOST: ${API_HOST:-api.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  caddy_data:
  caddy_config:
